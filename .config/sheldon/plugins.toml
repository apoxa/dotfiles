# Sheldon plugin manifest — https://sheldon.cli.rs
#
# Per-plugin configuration lives next to the plugin via hooks:
#   hooks.pre  -> emitted immediately, BEFORE the (deferred) source runs.
#   hooks.post -> wrapped in `zsh-defer eval '...'`, runs AFTER the plugin loads
#                 (single quotes keep $vars unexpanded until then).
# Regenerate the lockfile after edits:  sheldon lock

shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{% if hooks?.post %}zsh-defer eval '{{ hooks?.post }}'\n{% endif %}"
# Source immediately, then run hooks.post inline (for plugins that must not defer).
source_post = "{% for file in files %}source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

# zsh-defer itself must be sourced immediately (NOT deferred).
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# NOTE: the ^y (autosuggest-accept) binding is set in .zshrc's zvm_after_init,
# because zsh-vi-mode resets keybindings on init and would clobber it here.
[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]
hooks.pre = 'export ZSH_AUTOSUGGEST_BUFFER_MAX_SIZE=20; export ZSH_AUTOSUGGEST_HISTORY_IGNORE="cd *"'

# zsh-vi-mode resets all keybindings on init, so anything that binds keys must run
# in its zvm_after_init hook (populated before the deferred init via hooks.pre),
# otherwise atuin (^R), fzf and autosuggest-accept (^y) get clobbered.
# NOTE: guard with `command -v` (fresh PATH lookup), NOT `(( $+commands[x] ))` — the
# commands hash is not yet populated in zvm's after_init context and returns 0 there.
# NOTE: use `eval "$(...)"`, NOT `source <(...)`: process substitution fails there too.
[plugins.zsh-vi-mode]
github = "jeffreytse/zsh-vi-mode"
apply = ["defer"]
hooks.pre = """
ZVM_INIT_MODE=sourcing
zvm_after_init_commands+=(
  'command -v fzf >/dev/null 2>&1 && eval "$(fzf --zsh)"'
  'command -v atuin >/dev/null 2>&1 && eval "$(atuin init zsh --disable-up-arrow)"'
  'bindkey "^y" autosuggest-accept'
)
"""
hooks.post = 'ZVM_INSERT_MODE_CURSOR=$ZVM_CURSOR_BLOCK'

[plugins.kctl]
github = "yzdann/kctl"
apply = ["defer"]

[plugins.kubernetes-helpers]
local = "~/scratch/kubernetes-helpers"
apply = ["fpath", "defer"]
# compinit runs before sheldon in .zshrc, so it never sees this plugin's _* files;
# register them manually.
hooks.post = 'autoload -Uz _fremctl_download _fremctl_switch; compdef _fremctl_download fremctl_download; compdef _fremctl_switch fremctl_switch'

[plugins.zsh-autopair]
github = "hlissner/zsh-autopair"
apply = ["defer"]

[plugins.zsh-you-should-use]
github = "MichaelAquilina/zsh-you-should-use"
apply = ["defer"]
hooks.pre = 'export YSU_MESSAGE_POSITION="after"'

[plugins.zsh-watch]
github = "Thearas/zsh-watch"
apply = ["fpath", "defer"]
hooks.pre = '(( $+commands[viddy] )) && export ZSH_WATCH=viddy ZSH_WATCH_FLAGS="-t -d -n1 --pty"'
# see kubernetes-helpers above: compinit runs before sheldon, so _watch is never
# auto-discovered; register it manually.
hooks.post = 'autoload -Uz _watch; compdef _watch watch'

# NOTE: sheldon cannot skip a plugin conditionally, so tab-title always loads; 
# the env is only gated to non-Emacs/dumb/Vim terminals.
[plugins.zsh-tab-title]
github = "trystan2k/zsh-tab-title"
apply = ["defer"]
hooks.pre = '(( ! $+EMACS )) && [[ $TERM != "dumb" ]] && (( ! $+VIM_TERMINAL )) && export ZSH_TAB_TITLE_ENABLE_FULL_COMMAND=true ZSH_TAB_TITLE_CONCAT_FOLDER_PROCESS=true ZSH_TAB_TITLE_DEFAULT_DISABLE_PREFIX=true'

[plugins.zsh-bat]
github = "fdellwing/zsh-bat"
apply = ["defer"]

[plugins.zsh-256color]
github = "chrissicool/zsh-256color"
apply = ["defer"]

[plugins.git-ignore]
github = "laggardkernel/git-ignore"
apply = ["defer"]
# _git-ignore lives in functions/, not the repo root, so the built-in `fpath`
# template (which only adds {{ dir }} itself) doesn't cover it — add it directly.
# compinit runs before sheldon, so it's never auto-discovered either way;
# register it manually (see kubernetes-helpers above for the same pattern).
hooks.pre = 'fpath+=("$HOME/.local/share/sheldon/repos/github.com/laggardkernel/git-ignore/functions")'
hooks.post = 'alias gi="git-ignore"; autoload -Uz _git-ignore; compdef _git-ignore git-ignore; compdef _git-ignore gi'

[plugins.oh-my-zsh]
github = "ohmyzsh/ohmyzsh"
use = ["lib/completion.zsh"]

# Load bash completions last, so it doesn't overwrite other completions
[plugins.zsh-bash-completions-fallback]
github = "3v1n0/zsh-bash-completions-fallback"
apply = ["defer"]
hooks.pre = 'ZSH_BASH_COMPLETIONS_FALLBACK_PATH=/opt/homebrew/etc/bash_completion.d; ZSH_BASH_COMPLETIONS_FALLBACK_REPLACE_LIST=(wg-quick)'
